<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1a1a1a" />
<title>Nuestra Música</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg-image"></div>

<div class="app-container">
  
  <!-- COLUMNA IZQUIERDA: MENÚ Y LIBRERÍA -->
  <aside class="sidebar-left">
    <div class="nav-links">
      <a href="../menu.html" class="nav-item"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M15 18l-6-6 6-6"/></svg> Volver</a>
      <a href="#" class="nav-item active"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Inicio</a>
      <a href="#" class="nav-item"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg> Canciones</a>
    </div>

    <div class="library-header">
      <span><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> Tu Librería</span>
      <button id="btn-add-song" class="btn-icon-small">＋</button>
    </div>
    
    <!-- Aquí se cargan las canciones guardadas en Firebase -->
    <div class="library-list" id="library-list"></div>
  </aside>

  <!-- COLUMNA CENTRAL: CONTENIDO PRINCIPAL -->
  <main class="main-content">
    <header class="main-header">
      <h1>Bienvenido de nuevo, <span id="user-name">Joan</span>!</h1>
      <p class="subtitle" id="contador">0 playlists para ti</p>
      <div class="search-bar">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="global-search" placeholder="Buscar por título, artista o álbum..." readonly>
        <button id="btn-open-modal">Añadir Canción</button>
      </div>
    </header>

    <section class="content-section">
      <div class="section-header">
        <h2>Nuestras Canciones</h2>
      </div>
      <!-- Aquí se cargan las tarjetas de canciones -->
      <div class="grid-cards" id="music-grid"></div>
    </section>
  </main>

  <!-- COLUMNA DERECHA: REPRODUCIENDO AHORA -->
  <aside class="sidebar-right">
    <div class="now-playing-header">
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
      Now Playing
    </div>
    
    <div class="now-playing-card" id="now-playing-card" hidden>
      <div class="np-cover-wrap">
        <img id="np-cover" src="" alt="Cover">
      </div>
      <div class="np-info">
        <h3 id="np-title">Canción</h3>
        <p id="np-artist">Artista</p>
        <p class="np-dedication" id="np-dedication">Dedicatoria...</p>
      </div>
    </div>

    <div class="queue-header">Queue</div>
    <div class="queue-list" id="queue-list">
      <!-- Se llena dinámicamente -->
    </div>
  </aside>

</div>

<!-- BARRA INFERIOR FLOTANTE -->
<div class="bottom-player" id="bottom-player" hidden>
  <div class="bp-left">
    <img id="bp-cover" src="" alt="Cover">
    <div class="bp-info">
      <h4 id="bp-title">Título</h4>
      <p id="bp-artist">Artista</p>
    </div>
  </div>
  
  <div class="bp-center">
    <div class="bp-controls">
      <button class="bp-btn" id="btn-prev">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="bp-btn play-btn" id="btn-play-pause">
        <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="bp-btn" id="btn-next">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
    <div class="bp-progress">
      <span id="bp-time-current">0:00</span>
      <input type="range" id="bp-progress-bar" min="0" max="100" value="0">
      <span id="bp-time-total">0:00</span>
    </div>
  </div>

  <div class="bp-right">
    <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
    <input type="range" id="bp-volume" min="0" max="1" step="0.01" value="0.8">
  </div>
</div>

<!-- MODAL (Se mantiene igual para buscar y añadir) -->
<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal-card">
    <button type="button" class="modal-close" id="modal-close">✕</button>
    <h2 class="modal-title">Dedicar una canción</h2>
    <button id="btn-spotify-login" class="btn-spotify-login" style="display:none;">🎧 Conectar con Spotify</button>
    
    <label class="field">
      <span>Buscar en Spotify</span>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="input-search" placeholder="Ej: Morat - Cuando nadie ve">
        <button type="button" id="btn-search" class="btn-search">🔍</button>
      </div>
    </label>

    <div id="search-results" class="search-results-box"></div>

    <input type="hidden" id="selected-uri">
    <input type="hidden" id="selected-title">
    <input type="hidden" id="selected-artist">
    <input type="hidden" id="selected-cover">

    <div id="selected-song-display" class="selected-song-box">
      <span id="selected-song-text">Canción seleccionada</span>
    </div>

    <label class="field">
      <span>Dedicatoria (opcional)</span>
      <textarea id="input-dedication" rows="2" placeholder="Esta canción me recuerda a ti..."></textarea>
    </label>

    <button type="button" class="btn-save" id="btn-save">Guardar canción 🎵</button>
  </div>
</div>

<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script type="module" src="app.js"></script>
<script src="/navidad.js"></script>

</body>
</html>
