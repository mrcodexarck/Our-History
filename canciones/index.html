<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#241c17" />
<title>Nuestra Música</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Caveat:wght@500;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <a href="../menu.html" class="icon-btn" aria-label="Volver">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <div class="titulo">
    <span class="fecha-dia">Nuestra Música</span>
    <span class="fecha-anio" id="contador">—</span>
  </div>
  <button type="button" class="icon-btn" id="btn-add-song" aria-label="Añadir canción">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
  </button>
</header>

<main class="music-content">

  <!-- REPRODUCTOR PRINCIPAL -->
  <div class="player-container" id="player-container" hidden>
    <div class="player-vinyl" id="player-vinyl">
      <div class="vinyl-center"></div>
    </div>
    <div class="player-info">
      <h2 id="current-title">Título de la canción</h2>
      <p id="current-artist">Artista</p>
      <p class="player-dedication" id="current-dedication">Dedicatoria...</p>
    </div>
  </div>

  <p class="empty-state" id="empty-state" hidden>
    Aún no han dedicado canciones.<br>
    Dale al botón <strong>＋</strong> arriba a la derecha para empezar 🎵
  </p>

  <div class="music-grid" id="music-grid"></div>
</main>

<!-- MODAL PARA AÑADIR CANCIÓN CON BUSCADOR -->
<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal-card">
    <button type="button" class="modal-close" id="modal-close">✕</button>
    <h2 class="modal-title">Dedicar una canción</h2>
    
    <!-- BUSCADOR -->
    <label class="field">
      <span>Buscar canción (YouTube Music / YouTube)</span>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="input-search" placeholder="Ej: Coldplay Yellow" style="flex: 1;">
        <button type="button" id="btn-search" style="padding: 0 16px; background: #d9a86c; border: none; border-radius: 10px; cursor: pointer; color: #2a1d12; font-weight: bold;">🔍</button>
      </div>
    </label>

    <!-- RESULTADOS DE BÚSQUEDA -->
    <div id="search-results" style="display: none; max-height: 180px; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 10px; margin-bottom: 14px; border: 1px solid rgba(217,168,108,0.2);">
      <!-- Aquí se inyectan los resultados -->
    </div>

    <!-- CAMPOS OCULTOS (Se llenan al elegir canción) -->
    <input type="hidden" id="selected-url">
    <input type="hidden" id="selected-title">
    <input type="hidden" id="selected-artist">

    <!-- CANCIÓN SELECCIONADA -->
    <div id="selected-song-display" style="display: none; text-align: center; margin-bottom: 14px; padding: 10px; background: rgba(217,168,108,0.1); border-radius: 10px; border: 1px dashed #d9a86c;">
      <span style="font-family: 'Caveat', cursive; color: #f0e2c8; font-size: 1.2rem;" id="selected-song-text">Canción seleccionada</span>
    </div>

    <label class="field">
      <span>Tu dedicatoria (opcional)</span>
      <textarea id="input-dedication" rows="2" placeholder="Esta canción me recuerda a ti..."></textarea>
    </label>

    <button type="button" class="btn-save" id="btn-save">Dedicar canción 🎵</button>
  </div>
</div>

<!-- Contenedor oculto para la API de YouTube -->
<div id="youtube-api-player" style="position: fixed; top: -9999px; left: -9999px; width: 200px; height: 200px;"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script type="module" src="app.js"></script>
</body>
</html>
