<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Para ti 💛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --tinta:      #f0e2c8;
    --tinta-suave:#c9b48e;
    --acento:     #d9a86c;
    --fondo-1:    #241c17;
    --fondo-2:    #0c0907;
  }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center;
    padding: 24px; overflow: hidden;
    background: radial-gradient(circle at 50% 20%, var(--fondo-1), var(--fondo-2) 70%);
    font-family: "Cormorant Garamond", Georgia, serif;
    color: var(--tinta);
    position: relative;
  }

  /* ---- Emojis cayendo ---- */
  .decoraciones { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .deco-item {
    position: absolute; top: -80px; user-select: none;
    will-change: transform; animation: caer linear infinite;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,.5));
  }
  @keyframes caer {
    0%   { transform: translate(0, -80px) rotate(0deg); }
    100% { transform: translate(var(--deriva, 0px), 110vh) rotate(360deg); }
  }

  /* ---- Tarjeta ---- */
  .tarjeta {
    position: relative; z-index: 2;
    max-width: 460px; width: 100%;
    padding: clamp(36px, 6vw, 56px) clamp(26px, 5vw, 44px);
    text-align: center;
    background: linear-gradient(160deg, rgba(87,57,42,.55), rgba(46,28,19,.8));
    border: 1px solid rgba(217,168,108,.3);
    border-radius: 8px;
    box-shadow: 0 30px 60px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.04);
    backdrop-filter: blur(6px);
    animation: aparecer 1.2s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes aparecer {
    from { opacity: 0; transform: translateY(20px) scale(.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .tarjeta.error { animation: temblar .45s ease; }
  @keyframes temblar {
    0%, 100% { transform: translateX(0); }
    20%      { transform: translateX(-8px); }
    40%      { transform: translateX(8px); }
    60%      { transform: translateX(-5px); }
    80%      { transform: translateX(5px); }
  }

  .sobre {
    font-size: clamp(2.4rem, 6.5vw, 3.2rem);
    margin-bottom: 12px;
    animation: latir 2.4s ease-in-out infinite;
  }
  @keyframes latir {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.1); }
  }

  .para {
    font-family: "Caveat", cursive;
    font-size: clamp(1.3rem, 3vw, 1.6rem);
    color: var(--acento);
    margin-bottom: 6px;
  }

  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 700;
    font-size: clamp(1.7rem, 4.5vw, 2.3rem);
    line-height: 1.2;
    margin-bottom: 14px;
  }

  .instruccion {
    font-style: italic;
    font-size: clamp(.98rem, 2vw, 1.05rem);
    line-height: 1.6;
    color: var(--tinta-suave);
    margin-bottom: 26px;
    max-width: 320px;
    margin-left: auto; margin-right: auto;
  }

  /* ---- Input ---- */
  .campo { display: flex; gap: 8px; margin-bottom: 14px; }
  input[type="password"] {
    flex: 1;
    padding: 14px 18px;
    font-family: "Cormorant Garamond", serif;
    font-size: 1.1rem;
    color: var(--tinta);
    background: rgba(0,0,0,.28);
    border: 1px solid rgba(217,168,108,.28);
    border-radius: 40px;
    outline: none;
    text-align: center;
    letter-spacing: 1px;
    transition: border-color .2s, background .2s;
  }
  input:focus {
    border-color: rgba(217,168,108,.7);
    background: rgba(0,0,0,.4);
  }
  input::placeholder { color: rgba(201,180,142,.4); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 13px 28px;
    font-family: "Cormorant Garamond", serif;
    font-size: 1.05rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #2a1d12;
    background: linear-gradient(135deg, #e0b87e, #c9985a);
    border: none; border-radius: 40px;
    cursor: pointer;
    box-shadow: 0 10px 26px rgba(200,140,80,.35), inset 0 1px 0 rgba(255,255,255,.4);
    transition: transform .2s, box-shadow .2s, filter .2s;
  }
  .btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 16px 34px rgba(200,140,80,.5), inset 0 1px 0 rgba(255,255,255,.5);
    filter: brightness(1.05);
  }
  .btn:disabled { opacity: .7; cursor: wait; }

  .error {
    min-height: 22px;
    font-family: "Caveat", cursive;
    font-size: 1.15rem;
    color: #e88a7a;
    margin-top: 8px;
    opacity: 0;
    transition: opacity .3s;
  }
  .error.visible { opacity: 1; }

  .pista {
    margin-top: 22px;
    font-family: "Caveat", cursive;
    font-size: 1.1rem;
    color: rgba(217,168,108,.55);
  }

  @media (max-width: 480px) {
    .tarjeta { padding: 32px 22px; }
  }
</style>
</head>
<body>

<div class="decoraciones" id="deco" aria-hidden="true"></div>

<main class="tarjeta" id="tarjeta">
  <div class="sobre">🔒</div>
  <p class="para">Para ti, mi amor</p>
  <h1>Nuestra Historia</h1>
  <p class="instruccion">Escribe la palabra secreta que solo tú y yo sabemos 🤎</p>

  <form id="form" autocomplete="off">
    <div class="campo">
      <input
        type="password"
        id="clave"
        placeholder="palabra secreta…"
        autocomplete="off"
        spellcheck="false"
        required
      />
    </div>
    <button type="submit" class="btn" id="btn">
      Entrar <span>→</span>
    </button>
  </form>

  <p class="error" id="error"></p>
  <p class="pista" id="pista"></p>
</main>

<script>
/* ============================================================
   ✏️  CONFIGURACIÓN — SOLO TOCA ESTA PARTE
   ============================================================ */

// 👇 CAMBIA ESTO POR TU PALABRA SECRETA (todo en minúsculas)
const CLAVE = "nuestroamor";

// 👇 RUTA DEL LIBRO (déjala así, ya está bien)
const IR_A = "./nuestro-libro/";

// 👇 PISTA OPCIONAL (escribe "" si no quieres pista)
const PISTA = "Pista: cómo me llamas tú 🤎";

/* ============================================================
   De aquí para abajo no toques nada
   ============================================================ */

// Si ya entró antes en esta sesión, pasa directo
if (sessionStorage.getItem("acceso-libro") === "ok") {
  location.replace(IR_A);
}

const form    = document.getElementById("form");
const input   = document.getElementById("clave");
const btn     = document.getElementById("btn");
const errorEl = document.getElementById("error");
const tarjeta = document.getElementById("tarjeta");
const pistaEl = document.getElementById("pista");

if (PISTA) pistaEl.textContent = PISTA;

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const intento = input.value.trim().toLowerCase();
  if (!intento) return;

  btn.disabled = true;
  errorEl.classList.remove("visible");

  // pequeño delay para dar sensación de "comprobando"
  await new Promise(r => setTimeout(r, 350));

  if (intento === CLAVE.toLowerCase()) {
    sessionStorage.setItem("acceso-libro", "ok");
    errorEl.style.color = "#9fd8a0";
    errorEl.textContent = "Abriendo nuestro libro… 🤎";
    errorEl.classList.add("visible");
    setTimeout(() => location.href = IR_A, 700);
  } else {
    btn.disabled = false;
    input.value = "";
    input.focus();
    errorEl.style.color = "#e88a7a";
    errorEl.textContent = "Mmm… esa no es. Intenta otra vez 🤎";
    errorEl.classList.add("visible");

    tarjeta.classList.remove("error");
    void tarjeta.offsetWidth;
    tarjeta.classList.add("error");
  }
});

/* ---- Emojis cayendo ---- */
(function () {
  const EMOJIS = ["🤎", "🐵", "🤎", "🐒", "✨", "🔒"];
  const cont = document.getElementById("deco");
  const cantidad = window.innerWidth < 700 ? 14 : 30;

  for (let i = 0; i < cantidad; i++) {
    const el = document.createElement("span");
    el.className = "deco-item";
    el.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    el.style.fontSize = (18 + Math.random() * 30) + "px";
    el.style.left     = Math.random() * 100 + "%";
    el.style.opacity  = (0.3 + Math.random() * 0.5).toFixed(2);

    const duracion = 9 + Math.random() * 12;
    el.style.animationDuration = duracion + "s";
    el.style.animationDelay    = (-Math.random() * duracion) + "s";
    el.style.setProperty("--deriva", ((Math.random() - 0.5) * 120) + "px");

    cont.appendChild(el);
  }
})();
</script>
</body>
</html>
