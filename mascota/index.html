<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#241c17" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Nuestra Mascota</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <a href="../menu.html" class="icon-btn" aria-label="Volver">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <div class="titulo">
    <span class="fecha-dia">Nuestra Mascota</span>
    <span class="fecha-anio">Cuidándola juntos</span>
  </div>
  <div class="status" id="status"><span class="dot"></span></div>
</header>

<!-- PANTALLA CREAR MASCOTA -->
<section class="crear-mascota" id="crear-mascota" hidden>
  <h2>Elige a nuestra mascota</h2>
  <div class="tipos">
    <button class="tipo" data-tipo="gato">🐱<span>Gato</span></button>
    <button class="tipo" data-tipo="perro">🐶<span>Perro</span></button>
    <button class="tipo" data-tipo="dragon">🐲<span>Dragón</span></button>
    <button class="tipo" data-tipo="conejo">🐰<span>Conejo</span></button>
  </div>
  <input type="text" id="nombre-mascota" maxlength="15" placeholder="Ponle un nombre..." />
  <button class="btn-crear" id="btn-crear" disabled>Crear mascota ✨</button>
</section>

<!-- PANTALLA MASCOTA -->
<section class="mascota-area" id="mascota-area" hidden>

  <div class="mascota-stage">
    <div class="mascota-bubble" id="mascota-bubble">¡Hola!</div>
    <div class="mascota-avatar" id="mascota-avatar">🐱</div>
    <div class="mascota-nombre" id="mascota-nombre">—</div>
    <div class="mascota-info">
      <span class="nivel">Nivel <b id="mascota-nivel">1</b></span>
      <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div>
    </div>
  </div>

  <div class="panel-inferior">
    <div class="stats">
      <div class="stat">
        <span class="stat-icon">🍖</span>
        <div class="stat-bar"><div class="stat-fill" id="stat-hambre"></div></div>
        <span class="stat-num" id="num-hambre">100%</span>
      </div>
      <div class="stat">
        <span class="stat-icon">😊</span>
        <div class="stat-bar"><div class="stat-fill" id="stat-felicidad"></div></div>
        <span class="stat-num" id="num-felicidad">100%</span>
      </div>
      <div class="stat">
        <span class="stat-icon">⚡</span>
        <div class="stat-bar"><div class="stat-fill" id="stat-energia"></div></div>
        <span class="stat-num" id="num-energia">100%</span>
      </div>
      <div class="stat">
        <span class="stat-icon">🧼</span>
        <div class="stat-bar"><div class="stat-fill" id="stat-limpieza"></div></div>
        <span class="stat-num" id="num-limpieza">100%</span>
      </div>
    </div>

    <div class="acciones">
      <button class="accion" data-accion="alimentar">🍖<span>Alimentar</span></button>
      <button class="accion" data-accion="jugar">🎾<span>Jugar</span></button>
      <button class="accion" data-accion="banar">🛁<span>Bañar</span></button>
      <button class="accion" data-accion="dormir">💤<span>Dormir</span></button>
      <button class="accion" data-accion="carino">❤️<span>Cariño</span></button>
      <button class="accion" data-accion="curar">💊<span>Curar</span></button>
    </div>

  </div>
</section>

<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
