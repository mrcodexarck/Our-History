<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Manifiesto PWA -->

<!-- Metadatos para Android / Chrome -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#241c17">

<!-- Metadatos para iOS / Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nuestro Dibujo">
<link rel="apple-touch-icon" href="icons/icon-192x192.png">

<!-- Icono general -->
<link rel="icon" type="image/png" href="icons/icon-192x192.png">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#241c17" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Nuestro Dibujo del Día</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="app-header">
  <a href="../menu.html" class="icon-btn" aria-label="Volver">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <div class="titulo">
    <span class="fecha-dia" id="fecha-dia">—</span>
    <span class="fecha-anio" id="fecha-anio">—</span>
  </div>
  <div class="icon-btn placeholder"></div>
</header>

<div class="canvas-area">
  <div class="canvas-wrapper">
    <canvas id="canvas" width="900" height="900"></canvas>
  </div>
</div>

<div class="colors-bar" id="colors-bar"></div>

<footer class="toolbar">
  <button class="tool-btn active" data-tool="brush" id="tool-brush" aria-label="Pincel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
  </button>
  <button class="tool-btn" data-tool="eraser" id="tool-eraser" aria-label="Borrador">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16a2 2 0 010-3L14 2l8 8-7 7"/><line x1="6" y1="14" x2="12" y2="20"/></svg>
  </button>

  <div class="sizes" id="sizes">
    <button class="size-btn" data-size="3" aria-label="Fino"><span style="width:5px;height:5px"></span></button>
    <button class="size-btn active" data-size="8" aria-label="Medio"><span style="width:10px;height:10px"></span></button>
    <button class="size-btn" data-size="16" aria-label="Grueso"><span style="width:16px;height:16px"></span></button>
    <button class="size-btn" data-size="28" aria-label="Extra"><span style="width:22px;height:22px"></span></button>
  </div>

  <button class="tool-btn" id="btn-undo" aria-label="Deshacer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 8"/></svg>
  </button>
  <button class="tool-btn danger" id="btn-clear" aria-label="Borrar todo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
  </button>
</footer>

<div class="save-indicator" id="save-indicator">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  <span>Guardado</span>
</div>

<script type="module" src="app.js"></script>


</body>
</html>
