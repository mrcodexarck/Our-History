<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#241c17" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Nuestro Dibujo del Día</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="app-header">
  <a href="../menu.html" class="icon-btn" aria-label="Volver">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <div class="titulo">
    <span class="fecha-dia" id="fecha-dia">—</span>
    <span class="fecha-anio" id="fecha-anio">—</span>
  </div>
  <div class="status" id="status" title="Estado de conexión">
    <span class="dot"></span>
  </div>
</header>

<!-- ============================================================
     TABS DE HOJAS
============================================================ -->
<div class="tabs-hojas" id="tabs-hojas">
  <button type="button" class="tab active" data-hoja="1">
    <span class="tab-num">1</span>
    <span class="tab-label">Hoja 1</span>
  </button>
  <button type="button" class="tab" data-hoja="2">
    <span class="tab-num">2</span>
    <span class="tab-label">Hoja 2</span>
  </button>
</div>

<div class="canvas-area">
  <div class="canvas-wrapper">
    <canvas id="canvas" width="900" height="900"></canvas>
  </div>
</div>

<!-- ============================================================
     PANEL DE HERRAMIENTAS
     En desktop se ve normal. En móvil es un drawer inferior.
============================================================ -->
<div class="panel-herramientas" id="panel-herramientas">
  <div class="drawer-handle"></div>

  <button type="button" class="drawer-cerrar" id="drawer-cerrar" aria-label="Cerrar">✕</button>

  <!-- Colores -->
  <div class="paleta">
    <div class="paleta-titulo">
      <span>✏️ Colores</span>
    </div>
    <div class="lapices" id="lapices"></div>
  </div>

  <!-- Herramientas -->
  <div class="herramientas" id="herramientas">
    <button type="button" class="tool active" data-tool="lapiz" title="Lápiz">
      <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z" fill="currentColor"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" fill="currentColor"/></svg>
      <span>Lápiz</span>
    </button>
    <button type="button" class="tool" data-tool="marcador" title="Marcador">
      <svg viewBox="0 0 24 24"><path d="M15 3l6 6-9 9H6v-6l9-9z" fill="currentColor"/><rect x="3" y="19" width="18" height="2" rx="1" fill="currentColor"/></svg>
      <span>Marcador</span>
    </button>
    <button type="button" class="tool" data-tool="pincel" title="Pincel">
      <svg viewBox="0 0 24 24"><path d="M9.5 14.5c-1 2-3 3.5-6 4 2-3 3.5-5 5.5-6l.5 2z" fill="currentColor"/><path d="M14 10l-4 4-1-1 4-4c1-1 3-3 5-5 1.5-1.5 3-2 4-1 1 1 .5 2.5-1 4-2 2-4 4-5 3z" fill="currentColor"/></svg>
      <span>Pincel</span>
    </button>
    <button type="button" class="tool" data-tool="borrador" title="Borrador">
      <svg viewBox="0 0 24 24"><path d="M20 20H7L3 16a2 2 0 010-3L14 2l8 8-7 7" fill="currentColor"/></svg>
      <span>Borrar</span>
    </button>
    <button type="button" class="tool" id="btn-undo" title="Deshacer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 8"/></svg>
      <span>Deshacer</span>
    </button>
    <button type="button" class="tool danger" id="btn-clear" title="Limpiar todo">
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 11v6M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Limpiar</span>
    </button>
  </div>

  <!-- Tamaños -->
  <div class="tamanos" id="tamanos">
    <button type="button" data-size="3" title="Fino"><span style="width:4px;height:4px"></span></button>
    <button type="button" data-size="8" class="active" title="Normal"><span style="width:8px;height:8px"></span></button>
    <button type="button" data-size="16" title="Grueso"><span style="width:14px;height:14px"></span></button>
    <button type="button" data-size="28" title="Extra"><span style="width:20px;height:20px"></span></button>
  </div>
</div>

<!-- Botón flotante para abrir panel en móvil -->
<button type="button" class="btn-tools-mobile" id="btn-tools-mobile" aria-label="Herramientas">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="13.5" cy="6.5" r="2.5"/>
    <circle cx="17.5" cy="14.5" r="2.5"/>
    <circle cx="8.5" cy="7.5" r="2.5"/>
    <circle cx="6.5" cy="15.5" r="2.5"/>
    <path d="M12 22h9"/>
  </svg>
  <span>Herramientas</span>
</button>

<!-- Overlay oscuro detrás del drawer -->
<div class="drawer-overlay" id="drawer-overlay"></div>

<div class="save-indicator" id="save-indicator">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  <span>Guardado</span>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
