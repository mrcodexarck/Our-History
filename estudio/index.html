<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1a1a1a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Mis Proyectos" />
<meta name="description" content="Mis Proyectos - Estudio de Arte" />

<title>Mis Proyectos</title>

<!-- Preconnect para Google Fonts (carga más rápida) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Caveat:wght@500;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="home.css">
</head>
<body>

<!-- ============================================================
     HEADER
============================================================ -->
<header class="home-header">

  <a href="../menu.html" class="hbtn" aria-label="Volver al menú" title="Volver al menú">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </a>

  <h1 class="home-titulo" id="home-titulo">Mis Proyectos</h1>

  <div class="home-count" id="home-count" aria-live="polite">—</div>

</header>

<!-- ============================================================
     MAIN
============================================================ -->
<main class="home-main">

  <!-- Estado vacío -->
  <div class="home-vacio" id="home-vacio" hidden role="status">
    <div class="vacio-icono" aria-hidden="true">🎨</div>
    <h2>Aún no hay proyectos</h2>
    <p>Toca <strong>+ Nuevo</strong> para empezar tu primera obra</p>
  </div>

  <!-- Grid de proyectos -->
  <div class="home-grid" id="home-grid" role="list" aria-label="Lista de proyectos"></div>

</main>

<!-- ============================================================
     BOTÓN FLOTANTE — Nuevo proyecto
============================================================ -->
<button type="button" class="fab" id="fab-nuevo" aria-label="Crear nuevo proyecto" title="Nuevo proyecto (Ctrl+N)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
    <line x1="12" y1="5" x2="12" y2="19"/>
    <line x1="5" y1="12" x2="19" y2="12"/>
  </svg>
  <span>Nuevo</span>
</button>

<!-- ============================================================
     MODAL: Nuevo proyecto
============================================================ -->
<div class="modal" id="modal-nuevo" hidden role="dialog" aria-modal="true" aria-labelledby="modal-nuevo-titulo">
  <div class="modal-caja">

    <header class="modal-header">
      <h3 id="modal-nuevo-titulo">✨ Nuevo proyecto</h3>
      <button type="button" class="modal-cerrar" id="modal-cerrar" aria-label="Cerrar">✕</button>
    </header>

    <div class="modal-body">

      <label class="modal-campo">
        <span class="modal-label">Nombre del proyecto</span>
        <input
          type="text"
          id="proyecto-nombre"
          maxlength="40"
          placeholder="Ej: Mi primer paisaje"
          autocomplete="off"
          spellcheck="false"
          enterkeyhint="done"
        />
      </label>

      <div class="modal-campo">
        <span class="modal-label">Tamaño del lienzo</span>
        <div class="canvas-opciones" role="radiogroup" aria-label="Tamaño del lienzo">
          <button type="button" class="canvas-op active" data-ratio="1" role="radio" aria-checked="true" aria-label="Cuadrado">
            <div class="ratio-icon cuadrado" aria-hidden="true"></div>
            <span>Cuadrado</span>
          </button>
          <button type="button" class="canvas-op" data-ratio="0.75" role="radio" aria-checked="false" aria-label="Vertical">
            <div class="ratio-icon vertical" aria-hidden="true"></div>
            <span>Vertical</span>
          </button>
          <button type="button" class="canvas-op" data-ratio="1.333" role="radio" aria-checked="false" aria-label="Horizontal">
            <div class="ratio-icon horizontal" aria-hidden="true"></div>
            <span>Horizontal</span>
          </button>
        </div>
      </div>

    </div>

    <footer class="modal-footer">
      <button type="button" class="modal-btn cancelar" id="modal-cancelar">Cancelar</button>
      <button type="button" class="modal-btn crear" id="modal-crear">Crear proyecto</button>
    </footer>

  </div>
</div>

<!-- ============================================================
     MODAL: Opciones de proyecto
============================================================ -->
<div class="modal" id="modal-menu" hidden role="dialog" aria-modal="true" aria-labelledby="menu-titulo">
  <div class="modal-caja modal-caja-mini">

    <header class="modal-header">
      <h3 id="menu-titulo">Opciones</h3>
      <button type="button" class="modal-cerrar" id="menu-cerrar" aria-label="Cerrar">✕</button>
    </header>

    <div class="modal-body menu-lista">

      <button type="button" class="menu-op" id="menu-renombrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        <span>Renombrar</span>
      </button>

      <button type="button" class="menu-op danger" id="menu-eliminar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6M14 11v6"/>
        </svg>
        <span>Eliminar proyecto</span>
      </button>

    </div>

  </div>
</div>

<!-- ============================================================
     TOAST
============================================================ -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="home.js"></script>
</body>
</html>
