<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Gatos y Peces</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-header">
  <a href="../index.html" class="icon-btn">⬅️ Volver</a>
  <h1>🐱 Gatos y Peces</h1>
</header>

<main class="game-container">
  <div class="tug-area">
    <div class="cat cat-p1">🐱</div>
    <div class="fish" id="fish">🐟</div>
    <div class="cat cat-p2">😾</div>
  </div>

  <div class="controls">
    <button class="tap-btn btn-p1" id="btn-p1">¡Jala Joan! 🤎</button>
    <button class="tap-btn btn-p2" id="btn-p2">¡Jala Emily! 💛</button>
  </div>

  <div class="status" id="status-msg">¡El pez está en el centro!</div>
</main>

<script src="app.js"></script>
</body>
</html>
