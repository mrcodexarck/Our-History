<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#241c17" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Nuestro Álbum</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Caveat:wght@500;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <a href="../menu.html" class="icon-btn" aria-label="Volver">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <div class="titulo">
    <span class="fecha-dia">Nuestro Álbum</span>
    <span class="fecha-anio" id="contador">—</span>
  </div>
  <div class="icon-btn placeholder"></div>
</header>

<main class="album-contenido">
  <p class="album-vacio" id="album-vacio" hidden>
    Aún no hay dibujos guardados.<br>
    Vayan a <strong>Dibujos</strong> y empiecen a pintar 🤎
  </p>

  <div class="album-feed" id="album-feed"></div>
</main>

<!-- ============================================================
     LIGHTBOX
============================================================ -->
<div class="lightbox" id="lightbox" hidden>
  <button type="button" class="lb-cerrar" id="lb-cerrar" aria-label="Cerrar">✕</button>

  <div class="lb-contenido">
    <img id="lb-img" src="" alt="">
    <div class="lb-info">
      <span class="lb-fecha" id="lb-fecha"></span>
      <span class="lb-autor" id="lb-autor"></span>
    </div>
    <div class="lb-flechas">
      <button type="button" class="lb-nav" id="lb-prev" aria-label="Anterior">‹</button>
      <button type="button" class="lb-nav" id="lb-next" aria-label="Siguiente">›</button>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
